{{template "header" .}}

<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
  <h2 class="text-2xl font-bold mb-4 text-center">Login Sistem</h2>

  <!-- Menampilkan pesan error jika login gagal -->
  {{if .Error}}
  <p class="text-red-500 mb-4 text-center bg-red-100 p-2 rounded">{{.Error}}</p>
  {{end}}

  <!-- Form Login dengan HTMX -->
  <form hx-post="/login" hx-swap="outerHTML">
    <div class="mb-4">
      <label class="block mb-1 font-semibold">Username</label>
      <input
        type="text"
        name="username"
        class="w-full border p-2 rounded"
        required
        placeholder="Gunakan: admin"
      />
    </div>
    <div class="mb-6">
      <label class="block mb-1 font-semibold">Password</label>
      <input
        type="password"
        name="password"
        class="w-full border p-2 rounded"
        required
        placeholder="Gunakan: admin"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition"
    >
      Masuk
    </button>
  </form>
</div>

{{template "footer" .}}
