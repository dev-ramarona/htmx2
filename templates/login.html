{{template "header" .}}

<div class="mx-auto mt-10 max-w-md rounded-lg bg-white p-6 shadow-md">
  <h2 class="mb-4 text-center text-2xl font-bold">Login Sistem</h2>

  <!-- Menampilkan pesan error jika login gagal -->
  {{if .Error}}
  <p class="mb-4 rounded bg-yellow-300 p-2 text-center text-red-500">
    {{.Error}}
  </p>
  {{end}}

  <!-- Form Login dengan HTMX -->
  {{template "login_form" .}}
</div>

{{template "footer" .}}
