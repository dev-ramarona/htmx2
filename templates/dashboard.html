{{template "header" .}}

<div class="p-3">
  <div class="rounded-lg bg-white p-3 shadow-md">
    <h2 class="mb-6 text-2xl font-bold">Manajemen Karyawan</h2>

    <!-- HTMX Search Input -->
    <div class="mb-6">
      <input
        type="search"
        name="q"
        placeholder="Cari nama atau posisi (ketik untuk mencari)..."
        hx-get="/search"
        hx-trigger="input changed delay:500ms, search"
        hx-target="#table-body"
        class="w-full max-w-md rounded border border-gray-300 p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Tabel Data Karyawan -->
    <div class="h-96 overflow-auto">
      <table class="w-full">
        <thead class="sticky top-0 z-20">
          <tr class="bg-white shadow-md">
            <th
              class="sticky left-0 z-20 border-b border-gray-200 bg-white p-3 whitespace-nowrap"
            >
              Edit
            </th>
            {{range .Headers}}
            <th
              class="z-20 border-b border-gray-200 bg-white p-3 whitespace-nowrap"
            >
              {{.}}
            </th>
            {{end}}
          </tr>
        </thead>

        <!-- Tempat data dinamis akan dimasukkan oleh HTMX -->
        <tbody id="table-body">
          <!-- Memanggil isi awal tabel saat halaman pertama kali dimuat -->
          {{template "rows.html" .}}
        </tbody>
      </table>
    </div>
  </div>
</div>
