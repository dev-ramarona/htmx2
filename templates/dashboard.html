{{template "header" .}}

<div class="bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6">Manajemen Karyawan</h2>

  <!-- HTMX Search Input -->
  <div class="mb-6">
    <input
      type="search"
      name="q"
      placeholder="Cari nama atau posisi (ketik untuk mencari)..."
      class="w-full max-w-md border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      hx-get="/search"
      hx-trigger="input changed delay:500ms, search"
      hx-target="#table-body"
    />
  </div>

  <!-- Tabel Data Karyawan -->
  <div class="overflow-x-auto">
    <table class="w-full border-collapse border border-gray-200">
      <thead>
        <tr class="bg-gray-100">
          <th class="border border-gray-200 p-3 text-left">ID</th>
          <th class="border border-gray-200 p-3 text-left">Nama</th>
          <th class="border border-gray-200 p-3 text-left">Posisi</th>
          <th class="border border-gray-200 p-3 text-left">Email</th>
          <th class="border border-gray-200 p-3 text-center">Aksi</th>
        </tr>
      </thead>

      <!-- Tempat data dinamis akan dimasukkan oleh HTMX -->
      <tbody id="table-body">
        <!-- Memanggil isi awal tabel saat halaman pertama kali dimuat -->
        {{template "rows.html" .}}
      </tbody>
    </table>
  </div>
</div>

<!-- Tempat munculnya pop-up modal Edit -->
<div id="modal-container"></div>

{{template "footer" .}}
