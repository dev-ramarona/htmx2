{{define "login_form"}}
<div
  id="login-panel"
  x-data="{ showError: false }"
  x-init="
    {{if .Error}}
      $nextTick(() => showError = true)
    {{end}}
  "
>
  <!-- Form Login dengan HTMX -->
  <form hx-post="/login" hx-target="#login-panel" hx-swap="outerHTML">
    <div class="mb-4">
      <label class="mb-1 block font-semibold">Username</label>
      <input
        type="text"
        name="username"
        class="w-full rounded border p-2"
        required
        placeholder="Gunakan: admin"
        @input="showError = false"
      />
    </div>
    <div class="mb-6">
      <label class="mb-1 block font-semibold">Password</label>
      <input
        type="password"
        name="password"
        class="w-full rounded border p-2"
        required
        placeholder="Gunakan: admin"
        @input="showError = false"
      />
    </div>
    <button
      type="submit"
      class="w-full rounded bg-blue-600 p-2 text-white transition hover:bg-blue-700"
    >
      Masuk
    </button>
  </form>

  <!-- Menampilkan pesan error jika login gagal -->
  <div class="h-10 w-full">
    {{if .Error}}
    <div
      x-show="showError"
      x-transition:enter="duration-300"
      x-transition:enter-start="opacity-0 -translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="duration-300"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 -translate-y-2"
    >
      <p class="mb-4 rounded p-2 text-center text-red-500">{{.Error}}</p>
    </div>
    {{end}}
  </div>
</div>
{{end}}
