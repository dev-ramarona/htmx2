{{range .Employees}}
<tr class="hover:bg-gray-50 transition">
  <td class="border border-gray-200 p-3">{{.ID}}</td>
  <td class="border border-gray-200 p-3 font-medium">{{.Name}}</td>
  <td class="border border-gray-200 p-3">{{.Position}}</td>
  <td class="border border-gray-200 p-3 text-blue-600">{{.Email}}</td>
  <td class="border border-gray-200 p-3 text-center">
    <!-- Tombol untuk mengambil Modal -->
    <button
      hx-get="/edit/{{.ID}}"
      hx-target="#modal-container"
      class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm transition"
    >
      Edit
    </button>
  </td>
</tr>
{{else}}
<!-- Ditampilkan jika data kosong atau tidak ditemukan saat pencarian -->
<tr>
  <td
    colspan="4"
    class="border border-gray-200 p-6 text-center text-gray-500 italic"
  >
    Data tidak ditemukan.
  </td>
</tr>
{{end}}
