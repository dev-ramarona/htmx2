<!-- Background gelap transparan -->
<div
  x-data="editModal()"
  x-init="init()"
  @keydown.escape.window="close()"
  @click.outside="close()"
  class="fixed inset-0 z-20 flex items-center justify-center bg-black/30 backdrop-blur-sm"
>
  <!-- Kotak Modal Putih -->
  <div
    x-show="show"
    x-transition:enter="duration-300"
    x-transition:enter-start="opacity-0 scale-90 translate-x-10"
    x-transition:enter-end="opacity-100 scale-100 translate-x-0"
    x-transition:leave="duration-300"
    x-transition:leave-start="opacity-100 scale-100 translate-x-0"
    x-transition:leave-end="opacity-0 scale-90 translate-x-10"
    @click.outside="close()"
    class="w-96 rounded-xl bg-white p-6 shadow-xl"
  >
    <h3 class="mb-4 text-xl font-bold">Edit Data Karyawan (ID: {{.ID}})</h3>

    <!-- Form mengirim update data ke server -->
    <form hx-post="/edit/{{.ID}}" hx-target="#table-body">
      <div class="mb-4">
        <label class="mb-1 block text-sm font-semibold">Nama</label>
        <input
          type="text"
          name="name"
          value="{{.Name}}"
          required
          x-ref="name"
          class="focus:ri ng-2 w-full rounded border p-2 outline-none focus:ring-blue-500"
        />
      </div>
      <div class="mb-4">
        <label class="mb-1 block text-sm font-semibold">Posisi</label>
        <input
          type="text"
          name="position"
          value="{{.Position}}"
          required
          class="w-full rounded border p-2 outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="mb-6">
        <label class="mb-1 block text-sm font-semibold">Email</label>
        <input
          type="email"
          name="email"
          value="{{.Email}}"
          required
          class="w-full rounded border p-2 outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="flex justify-end gap-3">
        <!-- Tombol Batal (Hanya menghapus isi container modal via Vanilla JS) -->
        <button
          @click="close()"
          type="button"
          class="rounded bg-gray-300 px-4 py-2 text-gray-800 transition hover:bg-gray-400"
        >
          Batal
        </button>
        <button
          type="submit"
          class="rounded bg-blue-600 px-4 py-2 text-white transition hover:bg-blue-700"
        >
          Simpan
        </button>
      </div>
    </form>
  </div>
</div>
